<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#d4af37"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeLog"/>
<title>Trade Journal</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e12;--gold:#d4af37;--gold-dim:rgba(212,175,55,0.12);
  --text:#e8e0d0;--muted:#8a8a9a;--dim:#555;
  --green:#4ade80;--red:#f87171;
  --card:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.07);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Georgia',serif;overscroll-behavior:none}
body{background-image:radial-gradient(ellipse at 20% 0%,rgba(212,175,55,0.04) 0%,transparent 60%)}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold)}
.tagline{font-size:10px;color:var(--dim);font-family:monospace;margin-top:2px}
.header-btns{display:flex;gap:6px;flex-wrap:wrap}
.header-btn{padding:7px 14px;border-radius:7px;font-size:12px;cursor:pointer;font-family:monospace;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--muted);transition:all .15s}
.header-btn.active{background:var(--gold);color:#0e0e12;border-color:var(--gold);font-weight:700}

main{flex:1;overflow-y:auto;padding:20px;max-width:880px;width:100%;margin:0 auto}

/* ── Tabs (form) ── */
.form-tabs{display:flex;border-bottom:1px solid var(--border)}
.form-tab{flex:1;padding:13px;font-size:13px;cursor:pointer;font-family:monospace;background:transparent;color:var(--dim);border:none;border-bottom:2px solid transparent;transition:all .15s}
.form-tab.active{color:var(--gold);background:rgba(212,175,55,0.08);border-bottom-color:var(--gold)}
.form-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.form-body{padding:22px}

/* ── Inputs ── */
.field{margin-bottom:16px}
label.lbl{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:monospace}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);
  border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;
  font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .15s
}
input:focus,select:focus,textarea:focus{border-color:rgba(212,175,55,0.4)}
select option{background:#1a1a22}
textarea{resize:vertical;min-height:80px;line-height:1.6}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-3-1{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}

/* ── Buttons ── */
.btn{padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-family:monospace;transition:all .15s;border:none}
.btn-gold{background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.25);color:var(--gold)}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--dim)}
.btn-primary{background:var(--gold);color:#0e0e12;font-weight:700;font-family:'JetBrains Mono',monospace}
.btn-primary:disabled{background:rgba(212,175,55,0.2);color:var(--dim);cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn-row .btn-primary{flex:1}

/* ── Setup chips ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 13px;border-radius:6px;font-size:12px;cursor:pointer;font-family:monospace;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);transition:all .15s}
.chip.active{background:rgba(212,175,55,0.15);border-color:var(--gold);color:var(--gold)}

/* ── Mood picker ── */
.mood-row{display:flex;gap:8px;margin-bottom:5px}
.mood-btn{font-size:22px;background:rgba(255,255,255,0.04);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .15s;filter:grayscale(.5)}
.mood-btn.active{background:rgba(212,175,55,0.15);border-color:var(--gold);filter:none}
.mood-label{font-size:11px;color:var(--gold);font-family:monospace;height:16px}

/* ── Confidence slider ── */
input[type=range]{width:100%;accent-color:var(--gold)}

/* ── Emotion tags ── */
.etag{padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);transition:all .15s}
.etag.active{background:rgba(212,175,55,0.18);border-color:var(--gold);color:var(--gold)}

/* ── Screenshot zone ── */
.drop-zone{border:2px dashed rgba(255,255,255,0.12);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;background:rgba(255,255,255,0.02);transition:all .2s}
.drop-zone.drag{border-color:var(--gold);background:rgba(212,175,55,0.06)}
.drop-zone-icon{font-size:28px;margin-bottom:8px}
.drop-zone-text{font-size:13px;color:var(--muted);font-family:monospace}
.drop-zone-text span{color:var(--gold)}
.drop-zone-hint{font-size:10px;color:var(--dim);margin-top:5px;font-family:monospace}
.thumb-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);cursor:zoom-in;flex-shrink:0}
.thumb img{width:120px;height:76px;object-fit:cover;display:block}
.thumb-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.75));padding:14px 5px 4px;font-size:9px;color:#bbb;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb-del{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(0,0,0,0.8);border:none;border-radius:50%;color:var(--red);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;line-height:1}

/* ── Stats bar ── */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:monospace}
.stat-val{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}

/* ── Trade cards ── */
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.trade-row{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer}
.trade-ticker{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text);min-width:65px}
.dir-badge{font-size:11px;padding:2px 8px;border-radius:4px;font-family:monospace;font-weight:600}
.dir-long{background:rgba(74,222,128,0.1);color:var(--green);border:1px solid rgba(74,222,128,0.2)}
.dir-short{background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.2)}
.setup-badge{font-size:11px;color:var(--dim);font-family:monospace}
.trade-row-right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-shrink:0}
.pnl-badge{display:inline-block;padding:2px 10px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
.pnl-pos{background:rgba(74,222,128,0.12);color:var(--green);border:1px solid rgba(74,222,128,0.25)}
.pnl-neg{background:rgba(248,113,113,0.12);color:var(--red);border:1px solid rgba(248,113,113,0.25)}
.trade-date{font-size:10px;color:var(--dim);font-family:monospace}
.chevron{color:var(--dim);font-size:12px;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.trade-detail{border-top:1px solid var(--border);padding:16px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px}
.section-title{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:10px;font-family:monospace}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:10px}
.data-key{font-size:10px;color:var(--dim)}
.data-val{color:var(--text);margin-top:2px}
.notes-text{font-size:12px;color:#9a9a8a;line-height:1.6}
.mood-row-display{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.mood-item .mood-emoji{font-size:20px}
.mood-item .mood-lbl{font-size:10px;color:var(--muted)}
.arrow-sep{color:var(--dim);align-self:center;margin-top:4px}
.conf-display{margin-left:auto}
.conf-display .conf-val{font-family:monospace;font-size:18px;color:var(--gold)}
.etags-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.etag-display{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(212,175,55,0.1);color:var(--gold);border:1px solid rgba(212,175,55,0.2)}
.shots-section{border-top:1px solid var(--border);padding-top:14px;margin-top:4px}
.shots-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.shot-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);cursor:zoom-in}
.shot-thumb img{width:180px;height:113px;object-fit:cover;display:block}
.shot-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.75));padding:16px 6px 5px;font-size:10px;color:#ccc;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete-btn{display:block;margin-top:12px;margin-left:auto;font-size:11px;color:var(--red);background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:4px;padding:4px 10px;cursor:pointer;font-family:monospace}

/* ── Empty state ── */
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-family:monospace;font-size:13px}
.empty-sub{font-size:12px;margin-top:6px}
.empty-sub span{color:var(--gold)}

/* ── Lightbox ── */
#lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.93);align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:90vh;border-radius:8px;box-shadow:0 0 80px rgba(0,0,0,0.9);border:1px solid rgba(255,255,255,0.1);cursor:default}
#lb-close{position:fixed;top:18px;right:22px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50%;color:#fff;width:36px;height:36px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}

/* ── Toasts ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a22;border:1px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:8px;font-family:monospace;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:2000}
#toast.show{opacity:1}

/* ── PnL inline ── */
.pnl-line{display:flex;align-items:center;gap:8px;margin-top:8px}
.pnl-line-label{font-size:12px;color:var(--dim);font-family:monospace}

/* ── Responsive ── */
@media(max-width:600px){
  .stats-bar{grid-template-columns:1fr 1fr}
  .grid-3,.grid-3-1{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
  .shot-thumb img{width:140px;height:88px}
  .trade-row{flex-wrap:wrap;gap:6px}
  .trade-row-right{width:100%}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">Trade Journal</div>
      <div class="tagline">technical · emotional · visual</div>
    </div>
    <div class="header-btns">
      <button class="header-btn active" id="btn-journal" onclick="showView('journal')">📒 Journal</button>
      <button class="header-btn" id="btn-new" onclick="showView('new')">+ New Trade</button>
      <button class="header-btn" onclick="exportBackup()" title="Download all trades as a JSON backup file">⬇ Export</button>
      <button class="header-btn" onclick="document.getElementById('import-input').click()" title="Restore trades from a backup file">⬆ Import</button>
      <input type="file" id="import-input" accept=".json" style="display:none" onchange="importBackup(this)"/>
    </div>
  </header>
  <main id="main"></main>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <button id="lb-close" onclick="closeLightbox()">×</button>
  <img id="lb-img" src="" onclick="event.stopPropagation()"/>
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// DATABASE (IndexedDB)
// ═══════════════════════════════════════════
let db;
function initDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('TradeJournal', 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('trades')) {
        const store = d.createObjectStore('trades', { keyPath: 'id' });
        store.createIndex('date', 'date');
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction('trades', 'readonly');
    const req = tx.objectStore('trades').getAll();
    req.onsuccess = () => res(req.result.sort((a,b) => b.id - a.id));
    req.onerror = () => rej(req.error);
  });
}
function dbPut(trade) {
  return new Promise((res, rej) => {
    const tx = db.transaction('trades', 'readwrite');
    const req = tx.objectStore('trades').put(trade);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction('trades', 'readwrite');
    const req = tx.objectStore('trades').delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const MOODS = ['😰','😟','😐','🙂','😄'];
const MOOD_LABELS = ['Anxious','Uneasy','Neutral','Confident','Euphoric'];
const SETUPS = ['Breakout','Pullback','Reversal','Momentum','Range','News','Scalp','Other'];
const EMOTIONS = ['FOMO','Fear','Greed','Revenge','Disciplined','Uncertain','Calm','Impulsive'];

let view = 'journal';
let formTab = 'technical';
let trades = [];
let expandedIds = new Set();

let form = freshForm();
function freshForm() {
  return {
    ticker:'', direction:'Long', entry:'', exit:'', size:'',
    setup:'Breakout', techNotes:'',
    moodBefore:2, moodAfter:2, confidence:3, emotions:[], emotionNotes:'',
    date: new Date().toISOString().split('T')[0],
    screenshots:[]
  };
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function calcPnl(t) {
  const e = parseFloat(t.entry), x = parseFloat(t.exit), s = parseFloat(t.size);
  if (!e || !x || !s) return null;
  return t.direction === 'Long' ? (x - e) * s : (e - x) * s;
}
function fmtPnl(p) {
  if (p === null) return '—';
  return (p >= 0 ? '+' : '') + '$' + p.toFixed(2);
}
function pnlClass(p) {
  return p === null ? '' : p >= 0 ? 'pnl-pos' : 'pnl-neg';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Image compression
function compressImage(file, maxW=1400, q=0.82) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, maxW / img.width);
        canvas.width = img.width * ratio;
        canvas.height = img.height * ratio;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        res({ dataUrl: canvas.toDataURL('image/jpeg', q), name: file.name });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Lightbox
function openLightbox(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render() {
  const main = document.getElementById('main');
  if (view === 'journal') main.innerHTML = renderJournal();
  else main.innerHTML = renderForm();
  attachFormListeners();
}

function showView(v) {
  view = v;
  if (v === 'new') { form = freshForm(); formTab = 'technical'; }
  document.getElementById('btn-journal').classList.toggle('active', v === 'journal');
  document.getElementById('btn-new').classList.toggle('active', v === 'new');
  render();
}

// ─── Stats ───
function renderStats() {
  if (!trades.length) return '';
  const pnls = trades.map(calcPnl).filter(p => p !== null);
  const wins = pnls.filter(p => p > 0).length;
  const total = pnls.reduce((a,b) => a+b, 0);
  const wr = pnls.length ? Math.round(wins/pnls.length*100) : null;
  const avgMood = trades.reduce((a,t) => a+t.moodAfter, 0) / trades.length;
  const moodIdx = Math.round(avgMood);

  const statColor = (c) => `color:${c}`;
  return `<div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">Total Trades</div>
      <div class="stat-val" style="${statColor('#e8e0d0')}">${trades.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Win Rate</div>
      <div class="stat-val" style="${statColor(wr === null ? '#555' : wr >= 50 ? '#4ade80' : '#f87171')}">${wr !== null ? wr+'%' : '—'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total P&L</div>
      <div class="stat-val" style="${statColor(total >= 0 ? '#4ade80' : '#f87171')}">${pnls.length ? (total>=0?'+':'')+'$'+total.toFixed(2) : '—'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Mood</div>
      <div class="stat-val" style="${statColor('#d4af37')}">${MOODS[moodIdx]} ${avgMood.toFixed(1)}</div>
    </div>
  </div>`;
}

// ─── Journal view ───
function renderJournal() {
  if (!trades.length) return `<div class="empty">
    <div class="empty-icon">📒</div>
    <div class="empty-text">No trades logged yet.</div>
    <div class="empty-sub">Hit <span>+ New Trade</span> to start your journal.</div>
  </div>`;

  return renderStats() + trades.map(t => renderCard(t)).join('');
}

function renderCard(t) {
  const p = calcPnl(t);
  const borderColor = p === null ? '#555' : p >= 0 ? '#4ade80' : '#f87171';
  const isOpen = expandedIds.has(t.id);
  const shots = t.screenshots || [];
  const screenshotBadge = shots.length ? `<span style="font-size:11px;color:var(--dim)">📸 ${shots.length}</span>` : '';

  let detail = '';
  if (isOpen) {
    const techData = [
      ['Entry', t.entry || '—'], ['Exit', t.exit || '—'],
      ['Size', t.size || '—'], ['P&L', fmtPnl(p)]
    ];
    const etagsHtml = t.emotions.length
      ? t.emotions.map(e => `<span class="etag-display">${esc(e)}</span>`).join('')
      : '';
    const shotsHtml = shots.length ? `
      <div class="shots-section">
        <div class="section-title">📸 Screenshots (${shots.length})</div>
        <div class="shots-grid">
          ${shots.map((s,i) => `
            <div class="shot-thumb" onclick="openLightbox(tradeScreenshot(${t.id},${i}))">
              <img src="${esc(s.dataUrl)}" loading="lazy"/>
              <div class="shot-name">${esc(s.name)}</div>
            </div>`).join('')}
        </div>
      </div>` : '';

    detail = `<div class="trade-detail">
      <div class="detail-grid">
        <div>
          <div class="section-title">📊 Technical</div>
          <div class="data-grid">
            ${techData.map(([k,v]) => `<div><div class="data-key">${k}</div><div class="data-val">${esc(v)}</div></div>`).join('')}
          </div>
          ${t.techNotes ? `<div class="notes-text">${esc(t.techNotes)}</div>` : ''}
        </div>
        <div>
          <div class="section-title">🧠 Emotional</div>
          <div class="mood-row-display">
            <div class="mood-item">
              <div class="data-key">Before</div>
              <div class="mood-emoji">${MOODS[t.moodBefore]}</div>
              <div class="mood-lbl">${MOOD_LABELS[t.moodBefore]}</div>
            </div>
            <div class="arrow-sep">→</div>
            <div class="mood-item">
              <div class="data-key">After</div>
              <div class="mood-emoji">${MOODS[t.moodAfter]}</div>
              <div class="mood-lbl">${MOOD_LABELS[t.moodAfter]}</div>
            </div>
            <div class="conf-display">
              <div class="data-key">Confidence</div>
              <div class="conf-val">${t.confidence}/5</div>
            </div>
          </div>
          ${etagsHtml ? `<div class="etags-row">${etagsHtml}</div>` : ''}
          ${t.emotionNotes ? `<div class="notes-text">${esc(t.emotionNotes)}</div>` : ''}
        </div>
      </div>
      ${shotsHtml}
      <button class="delete-btn" onclick="deleteTrade(${t.id})">Delete entry</button>
    </div>`;
  }

  return `<div class="trade-card" style="border-left:3px solid ${borderColor}">
    <div class="trade-row" onclick="toggleCard(${t.id})">
      <div class="trade-ticker">${esc(t.ticker)}</div>
      <span class="dir-badge ${t.direction==='Long'?'dir-long':'dir-short'}">${t.direction}</span>
      <span class="setup-badge">${esc(t.setup)}</span>
      ${screenshotBadge}
      <div class="trade-row-right">
        ${p !== null ? `<span class="pnl-badge ${pnlClass(p)}">${fmtPnl(p)}</span>` : ''}
        <span style="font-size:18px">${MOODS[t.moodAfter]}</span>
        <span class="trade-date">${esc(t.date)}</span>
        <span class="chevron ${isOpen?'open'}">▼</span>
      </div>
    </div>
    ${detail}
  </div>`;
}

// Helper to get screenshot dataUrl by trade id + index (used in onclick)
window.tradeScreenshot = function(id, idx) {
  const t = trades.find(x => x.id === id);
  return t && t.screenshots ? t.screenshots[idx].dataUrl : '';
};

// ─── Form ───
function renderForm() {
  const tabs = [['technical','📊 Technical'],['emotional','🧠 Emotional'],['screenshots','📸 Screenshots']];
  const shotCount = form.screenshots.length;
  const tabsHtml = tabs.map(([k,label]) =>
    `<button class="form-tab ${formTab===k?'active':''}" onclick="switchFormTab('${k}')">${label}${k==='screenshots'&&shotCount?` (${shotCount})`:''}</button>`
  ).join('');

  let body = '';
  if (formTab === 'technical') body = renderTechForm();
  else if (formTab === 'emotional') body = renderEmotionalForm();
  else body = renderScreenshotsForm();

  return `<div class="form-wrap">
    <div class="form-tabs">${tabsHtml}</div>
    <div class="form-body">${body}</div>
  </div>`;
}

function renderTechForm() {
  const p = calcPnl(form);
  const pnlLine = p !== null ? `<div class="pnl-line">
    <span class="pnl-line-label">Calculated P&L:</span>
    <span class="pnl-badge ${pnlClass(p)}">${fmtPnl(p)}</span>
  </div>` : '';

  return `
  <div class="grid-3-1 field">
    <div>
      <label class="lbl">Ticker *</label>
      <input type="text" id="f-ticker" value="${esc(form.ticker)}" placeholder="AAPL" oninput="form.ticker=this.value.toUpperCase();this.value=form.ticker;updatePnlLine()"/>
    </div>
    <div>
      <label class="lbl">Direction</label>
      <select id="f-dir" onchange="form.direction=this.value">
        <option ${form.direction==='Long'?'selected':''}>Long</option>
        <option ${form.direction==='Short'?'selected':''}>Short</option>
      </select>
    </div>
    <div>
      <label class="lbl">Date</label>
      <input type="date" id="f-date" value="${esc(form.date)}" onchange="form.date=this.value"/>
    </div>
  </div>
  <div class="grid-3 field">
    <div>
      <label class="lbl">Entry Price</label>
      <input type="number" id="f-entry" value="${esc(form.entry)}" placeholder="0.00" oninput="form.entry=this.value;updatePnlLine()"/>
    </div>
    <div>
      <label class="lbl">Exit Price</label>
      <input type="number" id="f-exit" value="${esc(form.exit)}" placeholder="0.00" oninput="form.exit=this.value;updatePnlLine()"/>
    </div>
    <div>
      <label class="lbl">Size / Shares</label>
      <input type="number" id="f-size" value="${esc(form.size)}" placeholder="100" oninput="form.size=this.value;updatePnlLine()"/>
    </div>
  </div>
  <div id="pnl-line-wrap">${pnlLine}</div>
  <div class="field">
    <label class="lbl">Setup Type</label>
    <div class="chips">
      ${SETUPS.map(s => `<button class="chip ${form.setup===s?'active':''}" onclick="form.setup='${s}';render()">${s}</button>`).join('')}
    </div>
  </div>
  <div class="field">
    <label class="lbl">Technical Notes</label>
    <textarea placeholder="Entry reason, key levels, patterns, mistakes…" oninput="form.techNotes=this.value">${esc(form.techNotes)}</textarea>
  </div>
  <button class="btn btn-gold" style="width:100%" onclick="switchFormTab('emotional')">Next: Emotional Log →</button>`;
}

function updatePnlLine() {
  const wrap = document.getElementById('pnl-line-wrap');
  if (!wrap) return;
  const p = calcPnl(form);
  wrap.innerHTML = p !== null ? `<div class="pnl-line">
    <span class="pnl-line-label">Calculated P&L:</span>
    <span class="pnl-badge ${pnlClass(p)}">${fmtPnl(p)}</span>
  </div>` : '';
}

function renderEmotionalForm() {
  const moodPickerHtml = (field, label) => `
    <div>
      <label class="lbl">${label}</label>
      <div class="mood-row">
        ${MOODS.map((m,i) => `<button class="mood-btn ${form[field]===i?'active':''}" onclick="form['${field}']=${i};render()">${m}</button>`).join('')}
      </div>
      <div class="mood-label">${MOOD_LABELS[form[field]]}</div>
    </div>`;

  return `
  <div class="grid-2 field">
    ${moodPickerHtml('moodBefore','Mood Before Trade')}
    ${moodPickerHtml('moodAfter','Mood After Trade')}
  </div>
  <div class="field">
    <label class="lbl">Confidence — <span style="color:var(--gold)">${form.confidence}/5</span></label>
    <input type="range" min="1" max="5" value="${form.confidence}" oninput="form.confidence=+this.value;this.previousElementSibling.querySelector('span').textContent=this.value+'/5'"/>
  </div>
  <div class="field">
    <label class="lbl">Emotions Present</label>
    <div class="chips">
      ${EMOTIONS.map(e => `<button class="chip etag ${form.emotions.includes(e)?'active':''}" onclick="toggleEmotion('${e}')">${e}</button>`).join('')}
    </div>
  </div>
  <div class="field">
    <label class="lbl">Emotional Notes</label>
    <textarea style="min-height:90px" placeholder="How were you feeling? Did emotions affect decisions?" oninput="form.emotionNotes=this.value">${esc(form.emotionNotes)}</textarea>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="switchFormTab('technical')">← Back</button>
    <button class="btn btn-gold" onclick="switchFormTab('screenshots')">Next: Screenshots →</button>
  </div>`;
}

function renderScreenshotsForm() {
  const thumbsHtml = form.screenshots.map((s,i) => `
    <div class="thumb" onclick="openLightbox('${esc(s.dataUrl)}')">
      <img src="${esc(s.dataUrl)}" loading="lazy"/>
      <div class="thumb-name">${esc(s.name)}</div>
      <button class="thumb-del" onclick="event.stopPropagation();removeScreenshot(${i})">×</button>
    </div>`).join('');

  const hint = form.screenshots.length
    ? `<div style="font-size:11px;color:var(--dim);font-family:monospace;margin-top:10px">${form.screenshots.length} screenshot${form.screenshots.length>1?'s':''} — click to preview · × to remove</div>`
    : '';

  return `
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-zone-icon">📸</div>
    <div class="drop-zone-text">Drop chart screenshots here, or <span>click to browse</span></div>
    <div class="drop-zone-hint">PNG · JPG · WEBP — multiple files allowed</div>
  </div>
  <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="handleFileInput(this.files)"/>
  ${hint}
  <div class="thumb-grid">${thumbsHtml}</div>
  <div class="btn-row" style="margin-top:18px">
    <button class="btn btn-ghost" onclick="switchFormTab('emotional')">← Back</button>
    <button class="btn btn-primary" ${!form.ticker?'disabled':''} onclick="saveTrade()" id="save-btn">
      Log Trade${form.screenshots.length?' + '+form.screenshots.length+' screenshot'+(form.screenshots.length>1?'s':''):''}
    </button>
  </div>`;
}

// ═══════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════
function switchFormTab(tab) { formTab = tab; render(); }

function toggleCard(id) {
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  render();
}

function toggleEmotion(e) {
  if (form.emotions.includes(e)) form.emotions = form.emotions.filter(x => x !== e);
  else form.emotions = [...form.emotions, e];
  render();
}

async function handleFileInput(files) {
  const images = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!images.length) return;
  const compressed = await Promise.all(images.map(f => compressImage(f)));
  form.screenshots = [...form.screenshots, ...compressed];
  render();
}

function removeScreenshot(i) {
  form.screenshots = form.screenshots.filter((_,idx) => idx !== i);
  render();
}

async function saveTrade() {
  if (!form.ticker) return;
  const btn = document.getElementById('save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const trade = { ...form, id: Date.now() };
  await dbPut(trade);
  trades = await dbGetAll();
  form = freshForm();
  formTab = 'technical';
  showView('journal');
  toast('✓ Trade logged');
}

async function deleteTrade(id) {
  if (!confirm('Delete this trade entry?')) return;
  await dbDelete(id);
  trades = await dbGetAll();
  expandedIds.delete(id);
  render();
  toast('Entry deleted');
}

function attachFormListeners() {
  const dz = document.getElementById('drop-zone');
  if (!dz) return;
  dz.addEventListener('dragenter', () => dz.classList.add('drag'));
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('dragover', e => e.preventDefault());
  dz.addEventListener('drop', async e => {
    e.preventDefault(); dz.classList.remove('drag');
    await handleFileInput(e.dataTransfer.files);
  });
}

// ═══════════════════════════════════════════
// BACKUP — EXPORT & IMPORT
// ═══════════════════════════════════════════
async function exportBackup() {
  const all = await dbGetAll();
  if (!all.length) { toast('No trades to export'); return; }

  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    tradeCount: all.length,
    trades: all
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  a.href = url;
  a.download = `trade-journal-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`✓ Exported ${all.length} trade${all.length > 1 ? 's' : ''}`);
}

async function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = ''; // reset so same file can be re-selected

  const text = await file.text();
  let payload;
  try {
    payload = JSON.parse(text);
  } catch {
    toast('❌ Invalid backup file'); return;
  }

  // Accept either the envelope format or a raw array
  const incoming = Array.isArray(payload) ? payload : payload.trades;
  if (!Array.isArray(incoming) || !incoming.length) {
    toast('❌ No trades found in file'); return;
  }

  const existing = await dbGetAll();
  const existingIds = new Set(existing.map(t => t.id));
  let added = 0, skipped = 0;

  for (const trade of incoming) {
    if (!trade.id || !trade.ticker) { skipped++; continue; }
    if (existingIds.has(trade.id)) { skipped++; continue; } // no duplicates
    await dbPut(trade);
    added++;
  }

  trades = await dbGetAll();
  render();
  const msg = skipped
    ? `✓ Imported ${added} trade${added !== 1 ? 's' : ''} (${skipped} skipped — already exist)`
    : `✓ Imported ${added} trade${added !== 1 ? 's' : ''}`;
  toast(msg);
}

// BOOT

(async () => {
  await initDB();
  trades = await dbGetAll();
  render();
  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
